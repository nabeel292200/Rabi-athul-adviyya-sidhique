    <path d="M72 24 C70 22 65 21 62 24 C55 31 47 58 44 72 C43 75 40 77 37 77 C35 77 34 78.5 36 80 C39 82 46 81 49 80 C52 79 50 77 48 76 C47 75.5 48 73 49 69 L54 52 C54 52 68 51 73 53 L78 68 C79 72 78 75 75 76 C73 77 74 79 77 80 C80 81 87 80 89 78 C89 76 87 75 84 74 C81 73 81 70 79 65 L68 32 C67 28 68 26 72 24 Z" fill="url(#goldGrad)"/>
    <path d="M53 55 C59 53 67 53 74 56 C76 56.8 75 54 72 53 C66 51 58 52 52 53 C50.5 53.2 51 55 53 55 Z" fill="url(#goldGrad)"/>
    <path d="M62 24 C60 21 54 24 57 29 C60 34 70 44 72 55 C72 45 66 30 62 24 Z" fill="#D4AF37" opacity="0.7"/>
  </g>

  <!-- Interlacing central ampersand or ribbon loop -->
  <path d="M56 42 Q60 38 64 42 Q68 47 62 52 Q58 55 52 58 Q60 62 67 57" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
