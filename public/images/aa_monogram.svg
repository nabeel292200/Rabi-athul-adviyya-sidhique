      <stop offset="0%" stop-color="#B16C15"/>
      <stop offset="50%" stop-color="#E2A64C"/>
      <stop offset="100%" stop-color="#8C4E08"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
